# ---------------------------------------------------------------------------
# AcademyOS API — Fly.io
#   fly launch --no-deploy        (creates the app, keep this file)
#   fly secrets set MONGO_URI=... JWT_SECRET=...
#   fly deploy
# Secrets are set via `fly secrets`, never committed here.
# ---------------------------------------------------------------------------
app = "academyos-api"
primary_region = "bom"          # Mumbai

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "4000"
  CLIENT_URL = "https://academyos.webamazee.com"
  COOKIE_SECURE = "true"
  COOKIE_SAMESITE = "none"
  STORAGE_DRIVER = "local"
  PAYMENT_PROVIDER = "manual"
  TRIAL_DAYS = "14"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = false     # keep warm: cron jobs run in-process
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
